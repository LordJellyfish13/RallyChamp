name = "rallychamp-push"
main = "src/index.js"
compatibility_date = "2026-09-13"

# The project id is not a secret — it's already baked into the app's
# google-services.json. The service-account key very much is, and is set
# with `wrangler secret put SERVICE_ACCOUNT_JSON` instead of living here.
[vars]
FIREBASE_PROJECT_ID = "rallychamp"
